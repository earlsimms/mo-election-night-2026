# Builds site/data/results.json and deploys site/ to the gh-pages branch (GitHub Pages source: gh-pages / root).
# Outside the active election's live window it refreshes the race list + pre-election polls (results sources wait).
# Inside the window it polls sources every ~2 min (looping inside the job; GitHub cron floor is 5 min and runs can be late).
name: update-results
on:
  push: {branches: [main]}
  workflow_dispatch:
  schedule:
    - cron: "*/5 * 4-6 11 *"     # 2026 window (UTC Nov 4-6). FOR A NEW ELECTION edit these dates too (cron cannot read config)
    - cron: "17 */6 * * *"       # light heartbeat otherwise
concurrency: {group: results, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub-hosted job max is 360; one run can cover most of election night
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils && pip install beautifulsoup4
      - name: Build and deploy
        run: |
          git config user.name results-bot; git config user.email results-bot@users.noreply.github.com
          deploy() {
            rm -rf /tmp/out && cp -r site /tmp/out && touch /tmp/out/.nojekyll
            cd /tmp/out && git init -q -b gh-pages && git add -A && git -c user.name=results-bot -c user.email=results-bot@users.noreply.github.com commit -qm "deploy $(date -u +%FT%TZ)"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
            cd "$GITHUB_WORKSPACE"
          }
          CFG=$(cat elections/ACTIVE)
          read START END < <(python3 -c "import json,datetime as d;c=json.load(open('$CFG'));f=lambda k:int(d.datetime.fromisoformat(c.get(k,'1970-01-01T00:00:00Z').replace('Z','+00:00')).timestamp());print(f('live_start_utc'),f('live_end_utc'))")
          NOW=$(date -u +%s)
          # Started up to 60 min before the live window? Wait for it instead of exiting, so a kickoff run at ~5 PM CT works.
          if [ "$NOW" -lt "$START" ] && [ $((START - NOW)) -le 3600 ]; then sleep $((START - NOW)); NOW=$(date -u +%s); fi
          if [ "$NOW" -lt "$START" ] || [ "$NOW" -ge "$END" ]; then
            # pre/post-election: refresh race list + polls (polls cached 6h), results sources wait for live_start_utc
            python3 -m fetcher.fetch --config "$CFG" || true; deploy; exit 0; fi
          # Loop ~2 min per refresh for up to ~5h40m (scheduled runs can start hours late, so each run covers a long stretch;
          # a queued run picks up when this one ends). Stops early at live_end_utc.
          T0=$(date -u +%s)
          while [ $(( $(date -u +%s) - T0 )) -lt 20400 ] && [ "$(date -u +%s)" -lt "$END" ]; do
            python3 -m fetcher.fetch --config "$CFG" || true
            deploy || true
            sleep 110
          done
