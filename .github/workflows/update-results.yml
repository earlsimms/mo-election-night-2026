# Builds site/data/results.json and deploys site/ to the gh-pages branch (GitHub Pages source: gh-pages / root).
# Outside the active election's live_start_utc..live_end_utc window (elections/ACTIVE -> config) it deploys the committed data unchanged.
# Inside the window it polls sources every ~2 min (looping inside the job; GitHub cron floor is 5 min and runs can be late).
name: update-results
on:
  push: {branches: [main]}
  workflow_dispatch:
  schedule:
    - cron: "*/5 * 4-6 11 *"     # 2026 window (UTC Nov 4-6). FOR A NEW ELECTION edit these dates too (cron cannot read config)
    - cron: "17 */6 * * *"       # light heartbeat otherwise
concurrency: {group: results, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils && pip install beautifulsoup4
      - name: Build and deploy
        run: |
          git config user.name results-bot; git config user.email results-bot@users.noreply.github.com
          deploy() {
            rm -rf /tmp/out && cp -r site /tmp/out && touch /tmp/out/.nojekyll
            cd /tmp/out && git init -q -b gh-pages && git add -A && git -c user.name=results-bot -c user.email=results-bot@users.noreply.github.com commit -qm "deploy $(date -u +%FT%TZ)"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
            cd "$GITHUB_WORKSPACE"
          }
          CFG=$(cat elections/ACTIVE)
          read START END < <(python3 -c "import json,datetime as d;c=json.load(open('$CFG'));f=lambda k:int(d.datetime.fromisoformat(c.get(k,'1970-01-01T00:00:00Z').replace('Z','+00:00')).timestamp());print(f('live_start_utc'),f('live_end_utc'))")
          NOW=$(date -u +%s)
          if [ "$NOW" -lt "$START" ] || [ "$NOW" -ge "$END" ]; then deploy; exit 0; fi
          for i in $(seq 1 26); do
            python3 -m fetcher.fetch --config "$CFG" || true
            deploy || true
            sleep 110
          done
